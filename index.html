<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Phát Video 360 Độ - GitHub Pages</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-stereo-component@0.5.0/dist/aframe-stereo-component.min.js"></script>
    <style>
        #play-btn {
            position: absolute;
            z-index: 999;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <button id="play-btn">Bấm để xem Video 360° (Có âm thanh)</button>

    <a-scene stereo>
        <a-assets>
            <video id="video360" src="video360.mp4"
                   loop 
                   preload="auto"
                   playsinline
                   webkit-playsinline
                   crossorigin="anonymous">
            </video>
        </a-assets>

        <a-videosphere src="#video360" rotation="0 -90 0" stereo="mode: top; eye: left"></a-videosphere>

        <a-entity camera look-controls stereocam="eye: left;"></a-entity>
    </a-scene>

    <script>
        const playBtn = document.getElementById('play-btn');
        const video = document.getElementById('video360');

        playBtn.addEventListener('click', function() {
            video.muted = false; 
            video.play().then(() => {
                playBtn.style.display = 'none';
            }).catch(error => {
                console.error("Trình duyệt chặn phát video: ", error);
                video.muted = true;
                video.play();
                playBtn.innerText = "Lỗi âm thanh - Bấm để xem không tiếng";
            });
        });
    </script>
</body>
</html>
