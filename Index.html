<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Phát Video 360 Độ - GitHub Pages</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        /* Nút bấm để kích hoạt phát video (do chính sách trình duyệt chặn tự động phát có âm thanh) */
        #play-btn {
            position: absolute;
            z-index: 999;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <button id="play-btn">Bấm để xem Video 360°</button>

    <a-scene>
        <a-assets>
            <video id="video360" 
                   src="" 
                   autoplay 
                   loop 
                   muted 
                   playsinline
                   webkit-playsinline
                   crossorigin="anonymous">
            </video>
        </a-assets>

        <a-videosphere src="#video360" rotation="0 -90 0"></a-videosphere>

        <a-entity camera look-controls></a-entity>
    </a-scene>

    <script>
        // Xử lý sự kiện click để phát video và ẩn nút bấm
        const playBtn = document.getElementById('play-btn');
        const video = document.getElementById('video360');

        playBtn.addEventListener('click', function() {
            video.play();
            video.muted = false; // Bật lại âm thanh sau khi người dùng tương tác
            playBtn.style.display = 'none'; // Ẩn nút đi
        });
    </script>
</body>
</html>
